  <!-- =====================================================
       COPIAR PIX
       ===================================================== -->

  <script>

    /*
      Chave Pix / CNPJ da Med Car Service
    */

    const pixKey =
      "59.199.244/0001-98";


    const copyPixButton =
      document.getElementById(
        "copyPixButton"
      );


    const copyFeedback =
      document.getElementById(
        "copyFeedback"
      );


    /*
      Clique no botão Pix
    */

    copyPixButton.addEventListener(
      "click",
      async () => {

        try {

          /*
            Método moderno.
          */

          await navigator.clipboard.writeText(
            pixKey
          );


          showCopyFeedback();


        } catch (error) {

          /*
            Fallback para navegadores antigos.
          */

          const temporaryInput =
            document.createElement(
              "textarea"
            );


          temporaryInput.value =
            pixKey;


          temporaryInput.style.position =
            "fixed";


          temporaryInput.style.opacity =
            "0";


          temporaryInput.style.pointerEvents =
            "none";


          document.body.appendChild(
            temporaryInput
          );


          temporaryInput.focus();

          temporaryInput.select();


          document.execCommand(
            "copy"
          );


          temporaryInput.remove();


          showCopyFeedback();

        }

      }
    );


    /*
      Feedback visual após copiar.
    */

    function showCopyFeedback() {

      copyFeedback.classList.add(
        "is-visible"
      );


      clearTimeout(
        window.copyFeedbackTimeout
      );


      window.copyFeedbackTimeout =
        setTimeout(
          () => {

            copyFeedback.classList.remove(
              "is-visible"
            );

          },

          2200
        );

    }

  </script>
