<!DOCTYPE html>

<body>

    <!-- ===================================================

            class="brand-logo"
          >

        </div>


        <!-- Nome -->
        <h1 id="page-title">
          Med Car Service
        </h1>


        <!-- =================================================
             BOTÕES
             ================================================= -->

        <nav
          class="links"
          aria-label="Links principais da Med Car Service"
        >


          <!-- WhatsApp -->
          <a
            class="link-button"
            href="https://wa.me/5511981866685"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Chamar a Med Car Service no WhatsApp"
          >

            <span class="link-label">
              Chamar no WhatsApp
            </span>


            <span
              class="icon-badge icon-badge--whatsapp"
              aria-hidden="true"
            >

              <img
                src="./assets/seta-1.svg"

              >

            </span>

          </a>


          <!-- Instagram -->
          <a
            class="link-button"
            href="https://www.instagram.com/med_carservice/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Acessar Instagram da Med Car Service"
          >

            <span class="link-label">

            </span>


            <span
              class="icon-badge icon-badge--instagram"
              aria-hidden="true"
            >

              <img
                src="./assets/instagram.svg"
                alt=""
              >

            </span>

          </a>


          <!-- Google -->
          <a
            class="link-button"
            href="https://search.google.com/local/writereview?placeid=ChIJLSdbE1hDzpQRRysI6oH1tPs"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Avaliar a Med Car Service no Google"
          >

            <span class="link-label">
              Nos avalie no Google
            </span>


            <span
              class="icon-badge icon-badge--google"
              aria-hidden="true"
            >

              <svg
                viewBox="0 0 96 91"
                xmlns="http://www.w3.org/2000/svg"
              >

                <path
                  d="M47.5529 0L58.7786 34.5491H95.1057L65.7164 55.9017L76.9421 90.4509L47.5529 69.0983L18.1636 90.4509L29.3893 55.9017L3.05176e-05 34.5491H36.3272L47.5529 0Z"
                  fill="#FFC800"
                >

              </svg>

            </span>

          </a>


          <!-- =================================================
               PIX
               ================================================= -->

          <button
            class="link-button link-button--pix"
            id="copyPixButton"
            type="button"
            aria-label="Copiar chave Pix da Med Car Service"
          >

            <span class="link-label">
              Copiar chave Pix
            </span>


            <span

            >

              <!-- Ícone copiar -->
              <svg
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >

                <path
                  d="M8 7V5.75A2.75 2.75 0 0 1 10.75 3h7.5A2.75 2.75 0 0 1 21 5.75v7.5A2.75 2.75 0 0 1 18.25 16H17v2.25A2.75 2.75 0 0 1 14.25 21h-8.5A2.75 2.75 0 0 1 3 18.25v-8.5A2.75 2.75 0 0 1 5.75 7H8Zm2 0h4.25A2.75 2.75 0 0 1 17 9.75V14h1.25c.414 0 .75-.336.75-.75v-7.5a.75.75 0 0 0-.75-.75h-7.5a.75.75 0 0 0-.75.75V7Zm-4.25 2a.75.75 0 0 0-.75.75v8.5c0 .414.336.75.75.75h8.5a.75.75 0 0 0 .75-.75v-8.5a.75.75 0 0 0-.75-.75h-8.5Z"
                >

              </svg>

            </span>

          </button>


        </nav>


        <!-- Feedback do Pix -->
        <div
          class="copy-feedback"
          id="copyFeedback"
          role="status"
          aria-live="polite"
        >
          Chave Pix copiada!
        </div>


      </section>



      <!-- =================================================

      <!-- =================================================

      <a

        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir localização da Med Car Service no Google"
      >


        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"

        <span>
          Av. Fagundes de Oliveira, 223 - Piraporinha, Diadema - SP
        </span>

  <!-- =====================================================
       SOCIABLEKIT
       ===================================================== -->

  <script
    src="https://widgets.sociablekit.com/instagram-feed/widget.js"
    defer
  ></script>



  <!-- =====================================================
       COPIAR PIX
       ===================================================== -->

  <script>

    const pixKey = "59.199.244/0001-98";

    const copyPixButton =
      document.getElementById("copyPixButton");

    const copyFeedback =
      document.getElementById("copyFeedback");


    copyPixButton.addEventListener("click", async () => {

      try {

        /*
          Método moderno para copiar
          texto para a área de transferência.
        */
        await navigator.clipboard.writeText(pixKey);

        showCopyFeedback();

      } catch (error) {

        /*
          Fallback para navegadores mais antigos.
        */
        const temporaryInput =
          document.createElement("textarea");

        temporaryInput.value = pixKey;

        temporaryInput.style.position = "fixed";
        temporaryInput.style.opacity = "0";

        document.body.appendChild(temporaryInput);

        temporaryInput.focus();
        temporaryInput.select();

        document.execCommand("copy");

        temporaryInput.remove();

        showCopyFeedback();

      }

    });



    function showCopyFeedback() {

      copyFeedback.classList.add("is-visible");

      clearTimeout(
        window.copyFeedbackTimeout
      );


      window.copyFeedbackTimeout =
        setTimeout(() => {

          copyFeedback.classList.remove(
            "is-visible"
          );

        }, 2200);

    }

  </script>


</body>

</html>
